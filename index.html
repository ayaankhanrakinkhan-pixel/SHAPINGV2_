
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10091f">
<title>SHAPING</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#10091f;color:white;font-family:Arial,sans-serif;padding:22px;padding-bottom:100px}
header{display:flex;justify-content:space-between;align-items:center}
h1{letter-spacing:4px;color:#d8baff}
.card{background:#211638;border:1px solid #493568;border-radius:20px;padding:18px;margin:17px 0}
.stats{display:flex;justify-content:space-between;text-align:center}
.stat{font-size:13px;color:#bba9d6}
.stat b{display:block;font-size:23px;color:white;margin-top:8px}
h2{font-size:19px}
.exercise{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #493568}
button{background:#a66aff;color:white;border:0;padding:14px;border-radius:13px;font-weight:bold}
button:active{transform:scale(.96)}
.complete{width:100%;margin-top:15px;background:linear-gradient(90deg,#8d42ed,#d45cff)}
nav{position:fixed;bottom:0;left:0;right:0;background:#1c1230;display:flex;justify-content:space-around;padding:17px}
nav button{background:transparent;padding:5px;color:#d8c7f0}
.hidden{display:none}
.day{display:inline-flex;width:40px;height:40px;margin:5px;border-radius:12px;background:#38284e;align-items:center;justify-content:center}
.done{background:#a64dff}
.missed{background:#526b91}
.theme{padding:15px;margin:7px;border-radius:12px;background:#38284e}
#flash{position:fixed;inset:0;pointer-events:none;background:#b66cff;opacity:0;transition:opacity .3s}
</style>
</head>
<body>
<header>
<h1>SHAPING</h1>
<div>💎 <span id="diamonds">20</span></div>
</header>
<section id="home">
<div class="card">
<h2>YOUR 999 DAY JOURNEY</h2>
<div class="stats">
<div class="stat">STREAK<b id="streak">2 🔥</b></div>
<div class="stat">LIVES<b>❤️❤️</b></div>
<div class="stat">PROGRESS<b id="progress">0.2%</b></div>
</div>
</div>
<div class="card">
<h2>⚡ TODAY'S WORKOUT</h2>
<div id="workouts"></div>
<button class="complete" onclick="finish()">COMPLETE WORKOUT ✓</button>
<p style="text-align:center;color:#c9b6df;font-size:12px">Complete your workout to earn progress!</p>
</div>
<div class="card">
<h2>🏆 MILESTONES</h2>
<p id="milestone">2 workout days completed</p>
<div style="height:9px;background:#493568;border-radius:20px;overflow:hidden">
<div id="bar" style="height:100%;width:.2%;background:#bd70ff"></div>
</div>
</div>
</section>
<section id="calendar" class="hidden">
<h2>YOUR JOURNEY 📅</h2>
<div class="card">
<p>🔥 Completed days</p>
<p>❄️ Missed days</p>
<div id="days"></div>
</div>
</section>
<section id="themes" class="hidden">
<h2>THEMES 💎</h2>
<div class="card" id="themeList"></div>
</section>
<div id="flash"></div>
<nav>
<button onclick="show('home')">🏠<br>HOME</button>
<button onclick="show('calendar')">📅<br>CALENDAR</button>
<button onclick="show('themes')">🎨<br>THEMES</button>
</nav>
<script>
const backup={days:2,diamonds:20,lives:2};
let data=JSON.parse(localStorage.getItem('shapingData'))||{
...backup,completed:[],theme:0
};
const themes=[
['PURPLE','#10091f','#a66aff'],
['FIRE','#200b08','#ff633b'],
['ICE','#071b30','#50caff'],
['EMERALD','#071e17','#39d99b'],
['GOLD','#211808','#e8b64e'],
['CRIMSON','#220810','#ff4774'],
['NEON','#071b21','#42f5ef'],
['DARK','#090909','#aaaaaa']
];
function save(){
localStorage.setItem('shapingData',JSON.stringify(data));
}
function show(id){
['home','calendar','themes'].forEach(x=>
document.getElementById(x).classList.toggle('hidden',x!==id));
}
function render(){
document.getElementById('diamonds').textContent=data.diamonds;
document.getElementById('streak').textContent=data.days+' 🔥';
document.getElementById('progress').textContent=(data.days/999*100).toFixed(1)+'%';
document.getElementById('milestone').textContent=data.days+' workout days completed';
document.getElementById('bar').style.width=(data.days/999*100)+'%';
document.body.style.background=themes[data.theme][1];
document.querySelectorAll('.card').forEach(x=>x.style.background=
themes[data.theme][1]==='#090909'?'#202020':'#211638');
document.querySelectorAll('button').forEach(x=>{
if(x.classList.contains('complete'))x.style.background=themes[data.theme][2];
});
}
function workout(){
let full=[['Push-ups','2 × 8'],['Squats','2 × 12'],['Reverse lunges','2 × 8'],['Plank','2 × 20 sec'],['Calf raises','2 × 15'],['Glute bridges','2 × 12'],['Bird dogs','2 × 10']];
let short=[['Push-ups','1 × 8'],['Squats','1 × 12'],['Plank','1 × 20 sec']];
let day=new Date().getDay();
let exercises=[1,3,5].includes(day)?full:short;
document.getElementById('workouts').innerHTML=exercises.map(e=>
`<div class="exercise"><span>${e[0]}</span><b>${e[1]}</b></div>`).join('');
}
function sound(){
try{
let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);
o.frequency.value=650;g.gain.value=.08;
o.start();o.stop(a.currentTime+.2);
}catch(e){}
}
function finish(){
let today=new Date().toISOString().slice(0,10);
if(data.completed.includes(today)){alert('Already completed today! 🔥');return}
data.completed.push(today);
data.days++;
data.diamonds+=5;
save();render();sound();
let f=document.getElementById('flash');
f.style.opacity='.6';
setTimeout(()=>f.style.opacity='0',350);
alert('WORKOUT COMPLETE! 🔥 +5 DIAMONDS 💎');
}
function calendar(){
let el=document.getElementById('days');
el.innerHTML='';
for(let i=1;i<=31;i++){
let d=document.createElement('span');
d.className='day';
d.textContent=i;
if(data.completed.includes(new Date().getFullYear()+'-'+
String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(i).padStart(2,'0')))d.classList.add('done');
else if(i<new Date().getDate())d.classList.add('missed');
el.appendChild(d);
}
}
function renderThemes(){
let el=document.getElementById('themeList');
el.innerHTML=themes.map((t,i)=>`
<div class="theme">
<b>${t[0]}</b>
<button onclick="selectTheme(${i})">${i===data.theme?'SELECTED':i===0?'FREE':'10 💎'}</button>
</div>`).join('');
}
function selectTheme(i){
if(i!==0&&i!==data.theme){
if(data.diamonds<10){alert('Not enough diamonds!');return}
data.diamonds-=10;
}
data.theme=i;save();render();renderThemes();
}
const oldShow=show;
show=function(id){oldShow(id);if(id==='calendar')calendar();if(id==='themes')renderThemes()};
workout();render();calendar();
</script>
</body>
  </html>
